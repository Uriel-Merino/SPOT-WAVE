[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spot_wave"
dynamic = ["version"]
description = "Wavelet filtering of stellar activity in RVs (wavepal + CARMCMC) and orbital fitting with CONAN, for a single target."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Uriel" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "seaborn",
    "joblib",
    "acor",
    "conan-exoplanet @ git+https://github.com/Uriel-Merino/CONAN.git",
    # wavepal (with CARMCMC in carmcmc/) is NOT declared here: its
    # installation compiles carmcmc against BOOST/ARMADILLO.
    # Install it manually (see README, "Installation" section).
]

[project.scripts]
spot-wave = "spot_wave.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "spot_wave.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["spot_wave*"]
