[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spot_wave"
dynamic = ["version"]
description = "Filtrado wavelet de actividad estelar en RVs (wavepal + CARMCMC) y ajuste orbital con CONAN, para un unico target."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Uriel" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "seaborn",
    "joblib",
    # CONAN (tu fork) SI tiene un setup.py/pyproject.toml modernos ->
    # pip lo instala solo, sin pasos manuales:
    "conan-exoplanet @ git+https://github.com/Uriel-Merino/CONAN.git",
    # wavepal (con CARMCMC en carmcmc/) NO se declara aqui: su instalacion
    # compila carmcmc contra BOOST/ARMADILLO via Linux_install.sh /
    # MacOSX_install.sh, algo que pip no puede hacer por ti. Instalalo a
    # mano (ver README, seccion "Instalacion").
]

[project.scripts]
spot-wave = "spot_wave.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "spot_wave.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["spot_wave*"]
